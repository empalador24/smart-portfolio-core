[tool.poetry]
name = "smart-portfolio-core"
version = "0.1.0"
description = "Core bancario simulado de SmartPortfolio fintech"
authors = [
    "Cristian Javier Oyola Tovar"
]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
pydantic-settings = "^2.3"
yfinance = "^0.2"
scikit-learn = "^1.5"
aiohttp = "^3.10"
pandas = "^2.2"
numpy = "^1.26"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
python-dotenv = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
